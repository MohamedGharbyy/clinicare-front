<div class="shell" [class.sidebar-open]="sidebarOpen()">
  <!-- Shared SVG markup for sidebar icons. The current icon name is passed in
       via the template context. -->
  <ng-template #navIcon let-icon="icon">
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @switch (icon) {
        @case ('dashboard') {
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
        }
        @case ('appointments') {
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        }
        @case ('schedule') {
          <circle cx="12" cy="12" r="10" />
          <path d="M12 6v6l4 2" />
        }
        @case ('users') {
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        }
        @case ('records') {
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <path d="M14 2v6h6" />
          <path d="M16 13H8M16 17H8M10 9H8" />
        }
        @case ('prescriptions') {
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
          <rect x="9" y="3" width="6" height="4" rx="1" />
          <path d="M9 12h6M9 16h4" />
        }
        @case ('messages') {
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
          />
        }
        @case ('settings') {
          <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3" />
          <path d="M1 14h6M9 8h6M17 16h6" />
        }
      }
    </svg>
  </ng-template>

  <!-- Top navigation bar -->
  <header class="topbar">
    <button
      type="button"
      class="icon-btn menu-btn"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-label="Toggle navigation menu"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M3 6h18M3 12h18M3 18h18" />
      </svg>
    </button>

    <a class="brand" [routerLink]="dashboardUrl()">
      <img class="brand-logo" src="/clinicare-logo.png" alt="" />
    </a>

    <label class="search">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <input type="search" placeholder="Search…" aria-label="Search" />
    </label>

    <span class="topbar-spacer"></span>

    <button type="button" class="icon-btn" aria-label="Notifications">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="notify-dot" aria-hidden="true"></span>
    </button>

    <div class="user-chip" [attr.title]="user()?.email ?? ''">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="user-email">{{ user()?.email }}</span>
      <span class="role-tag">{{ roleLabel() }}</span>
    </div>

    <button type="button" class="logout-btn" (click)="logout()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      <span class="logout-label">Log out</span>
    </button>
  </header>

  <!-- Left sidebar -->
  <aside class="sidebar" aria-label="Primary">
    <nav class="sidebar-inner">
      @for (section of navSections(); track section.label) {
        <div class="nav-section">
          <p class="nav-section-label">{{ section.label }}</p>
          @for (item of section.items; track item.label) {
            @if (item.route) {
              <a
                class="nav-item"
                [routerLink]="item.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.title]="item.label"
                (click)="closeSidebar()"
              >
                <span class="nav-icon">
                  <ng-container
                    *ngTemplateOutlet="navIcon; context: { icon: item.icon }"
                  ></ng-container>
                </span>
                <span class="nav-label">{{ item.label }}</span>
              </a>
            } @else {
              <span class="nav-item disabled" [attr.title]="item.label" aria-disabled="true">
                <span class="nav-icon">
                  <ng-container
                    *ngTemplateOutlet="navIcon; context: { icon: item.icon }"
                  ></ng-container>
                </span>
                <span class="nav-label">{{ item.label }}</span>
                <span class="soon-badge">Soon</span>
              </span>
            }
          }
        </div>
      }
    </nav>
  </aside>

  @if (sidebarOpen()) {
    <button
      type="button"
      class="backdrop"
      aria-label="Close navigation menu"
      (click)="closeSidebar()"
    ></button>
  }

  <!-- Main dashboard area (routed dashboard pages render here) -->
  <main class="main">
    <router-outlet />
  </main>
</div>
